    <style>
        * {
            margin: 0;

            width: 100vw;
            height: 300px;
            border: 2px solid yellow;

        }
        @media ( min-width:992px  ){
            .container{
                justify-content: center;
            }

                width: 20vw;
            }

       }

</head>
