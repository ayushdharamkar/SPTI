<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body>

    <div class="container-fluid">
        <div class="card w-50">
            <div class="card-header">
                <h3>Acer Monitor</h3>
                <p>50% off</p>

            </div>
            <div class="card-body">

                <img class="w-100" src="../../assets/images/monitor.avif" alt="">
                
                <p>&#8377 30,000</p>
                <p>4.5 <span class="bi bi-star-fill text-warning"></span>
                    <span class="bi bi-star-fill text-warning"></span>
                    <span class="bi bi-star-fill text-warning"></span>
                    <span class="bi bi-star-fill text-warning"></span>
                    <span class="bi bi-star text-warning"></span>

                </p>
                <p>22,347 ratings</p>

            </div>
            <div class="card-footer">
                <button class="btn btn-warning w-100 text-dark"><span class="bi bi-cart4"></span> Add to cart</button>
                

            </div>
        </div>




    </div>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="../../node_modules/jquery/dist/jquery.js"></script>



</body>

</html>
