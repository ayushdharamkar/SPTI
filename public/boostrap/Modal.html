<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     
    <title>Document</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">

   
</head>
<body>

    <div class="container m-3">
        <button class="btn btn-outline-warning" data-bs-toggle="modal" data-bs-target="#sign">Sign Up</button>
        <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#log">Login</button>
        

    
    
        <div class="modal fade" id="sign">
            
            <div class="modal-dialog">
                
                <div class="modal-content">

                    <div class="modal-header">
                        <h4>Sign In</h4>
                        <button class="btn btn-close" data-bs-dismiss="modal" ></button>

                    </div>
                    <div class="modal-body">
                        
                        <p>Enter Your Email</p>
                        <input type="email" placeholder="Email"><br><br>
                        

                        <p>Enter your Mobile Number</p>
                        <input type="number" placeholder="Mobile No."><br><br>

                        <p>Create your Username</p>
                        <input type="text" placeholder="username"><br><br>

                        <p>create Your Password</p>
                        <input type="password" placeholder="password"><br><br>

                        <p>Confirm Password</p>
                        <input type="password" placeholder="password"><br><br>


                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-success" type="submit">Submit</button>
                        <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>

                    </div>
                    
                    
                   

                </div>
            </div>
        </div>

        <div class="modal fade " id="log">
            
            <div class="modal-dialog ">
                
                <div class="modal-content">

                    <div class="modal-header">
                        <h4>Login</h4>
                        <button class="btn btn-close" data-bs-dismiss="modal" ></button>

                    </div>
                    <div class="modal-body">
                        <p>Enter Your Username</p>
                        <input type="text" placeholder="username"><br><br>

                        

                        <p>Enter Your Password</p>
                        <input type="password" placeholder="password"><br><br>

                        


                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-success" type="submit">Submit</button>
                        <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>

                    </div>
                    
                    
                   

                </div>
            </div>
        </div>
        </div>
   
    
    <script src="../../node_modules/jquery/dist/jquery.js"></script>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    
</body>
</html>
